global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: local

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: ticketflow-api
    metrics_path: /metrics
    static_configs:
      - targets:
          - api:3000
        labels:
          service: ticketflow-api
